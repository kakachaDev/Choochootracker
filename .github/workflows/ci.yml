name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build and run tests
        run: |
          log="$RUNNER_TEMP/tracker-tests.log"
          if make -C tracker -f Makefile.test -j4 > "$log" 2>&1; then
            tail -n 30 "$log"
          else
            tail -n 100 "$log"
            python3 - "$log" <<'PY'
          import pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          failures = [i for i, line in enumerate(lines) if re.search(r"error:|undefined reference|FAILED|is NOT correct|FATAL ERROR", line)]
          for i in failures[-8:]:
              message = "\n".join(lines[max(0, i - 2):i + 4])[:1800]
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error::" + message)
          PY
            exit 1
          fi

  web-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Check Web entry point contract
        run: |
          grep -Fq '<canvas id="canvas"' web/index.html
          ! grep -Eq '^WEB_CFLAGS.*DESKTOP_BUILD' tracker/Makefile.web
      - name: Test browser storage queue
        run: node --test tools/test_web_storage.cjs
